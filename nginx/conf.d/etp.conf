# Режим HTTP (без TLS). Активируется скриптом scripts/switch-tls.sh http
# Публичный порт gateway: 80.
# Этот файл — активный vhost. Не редактируйте вручную: переключайте switch-tls.sh.

server {
    listen 80;
    server_name _;

    include /etc/nginx/snippets/proxy-api.conf;
    include /etc/nginx/snippets/proxy-reverb.conf;
    include /etc/nginx/snippets/spa.conf;
}
