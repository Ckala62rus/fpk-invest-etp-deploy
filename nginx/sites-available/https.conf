# Режим HTTPS. Активируется скриптом scripts/switch-tls.sh https
# Сертификаты: deploy/nginx/certs/fullchain.pem + privkey.pem
# HTTP → HTTPS redirect на :80; приложение на :443.

server {
    listen 80;
    server_name _;

    # ACME / проверка домена (если понадобится)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # Современный минимум TLS
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # HSTS (после стабильной работы HTTPS можно раскомментировать)
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    include /etc/nginx/snippets/proxy-api.conf;
    include /etc/nginx/snippets/proxy-reverb.conf;
    include /etc/nginx/snippets/spa.conf;
}
